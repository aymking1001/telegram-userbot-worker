name: Telegram UserBot Worker

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'معرف المحادثة'
        required: true
        type: string

      message_id:
        description: 'رقم الرسالة'
        required: true
        type: string

      source_chat_id:
        description: 'معرف المحادثة الأصلية'
        required: true
        type: string

      source_message_id:
        description: 'رقم الرسالة الأصلية'
        required: true
        type: string

      source_username:
        description: 'اسم المستخدم للمصدر'
        required: false
        type: string
        default: ''

      title:
        description: 'عنوان الصوت'
        required: false
        type: string
        default: ''

      duration:
        description: 'مدة الصوت'
        required: false
        type: string
        default: ''

      cloudinary_cloud_name:
        description: 'Cloudinary Cloud Name'
        required: true
        type: string

      cloudinary_api_key:
        description: 'Cloudinary API Key'
        required: true
        type: string

      cloudinary_api_secret:
        description: 'Cloudinary API Secret'
        required: true
        type: string

      callback_url:
        description: 'n8n callback URL'
        required: true
        type: string


jobs:
  forward-voice:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram UserBot
        env:

          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}

          SOURCE_CHAT_ID: ${{ github.event.inputs.source_chat_id }}
          SOURCE_MESSAGE_ID: ${{ github.event.inputs.source_message_id }}
          SOURCE_USERNAME: ${{ github.event.inputs.source_username }}

          TITLE: ${{ github.event.inputs.title }}
          DURATION: ${{ github.event.inputs.duration }}

          CLOUDINARY_CLOUD_NAME: ${{ github.event.inputs.cloudinary_cloud_name }}
          CLOUDINARY_API_KEY: ${{ github.event.inputs.cloudinary_api_key }}
          CLOUDINARY_API_SECRET: ${{ github.event.inputs.cloudinary_api_secret }}

          CALLBACK_URL: ${{ github.event.inputs.callback_url }}

        run: python worker.py
