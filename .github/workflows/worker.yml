name: Telegram UserBot Worker

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'معرف المحادثة المراد الإرسال إليها'
        required: true
        type: string
      message_id:
        description: 'رقم الرسالة الموجودة'
        required: true
        type: string
      source_chat_id:
        description: 'معرف المحادثة الأصلية'
        required: true
        type: string
      source_message_id:
        description: 'رقم الرسالة الأصلية'
        required: true
        type: string
      source_username:
        description: 'اسم المستخدم للمصدر'
        required: false
        type: string
        default: ''

jobs:
  forward-voice:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install telethon

      - name: Create Python script
        run: |
          cat > worker.py << 'EOF'
          import asyncio
          import os
          import sys
          from telethon import TelegramClient, events
          from telethon.sessions import StringSession
          from telethon.errors import SessionPasswordNeededError, FloodWaitError
          import time

          async def main():
              try:
                  # قراءة المتغيرات
                  api_id = int(os.environ.get('TELEGRAM_API_ID', 0))
                  api_hash = os.environ.get('TELEGRAM_API_HASH', '')
                  session_string = os.environ.get('TELEGRAM_SESSION', '')
                  
                  chat_id = os.environ.get('CHAT_ID', '')
                  message_id = int(os.environ.get('MESSAGE_ID', 0))
                  source_chat_id = os.environ.get('SOURCE_CHAT_ID', '')
                  source_message_id = int(os.environ.get('SOURCE_MESSAGE_ID', 0))
                  source_username = os.environ.get('SOURCE_USERNAME', '')

                  if not all([api_id, api_hash, session_string, chat_id, source_chat_id]):
                      print("❌ خطأ: المتغيرات البيئية غير مكتملة")
                      print(f"API_ID: {'موجود' if api_id else 'مفقود'}")
                      print(f"API_HASH: {'موجود' if api_hash else 'مفقود'}")
                      print(f"SESSION: {'موجود' if session_string else 'مفقود'}")
                      print(f"CHAT_ID: {'موجود' if chat_id else 'مفقود'}")
                      print(f"SOURCE_CHAT_ID: {'موجود' if source_chat_id else 'مفقود'}")
                      sys.exit(1)

                  print(f"📋 المعلومات:")
                  print(f"  - Chat ID: {chat_id}")
                  print(f"  - Message ID: {message_id}")
                  print(f"  - Source Chat ID: {source_chat_id}")
                  print(f"  - Source Message ID: {source_message_id}")
                  print(f"  - Source Username: {source_username}")

                  # إنشاء العميل
                  client = TelegramClient(
                      StringSession(session_string),
                      api_id,
                      api_hash
                  )

                  try:
                      # تسجيل الدخول
                      await client.start()
                      me = await client.get_me()
                      print(f"✅ تم تسجيل الدخول بنجاح كـ: {me.first_name} (ID: {me.id})")

                      # جلب المصدر والهدف
                      try:
                          # محاولة جلب المصدر
                          if source_username:
                              try:
                                  source_entity = await client.get_entity(f"@{source_username}")
                              except:
                                  source_entity = await client.get_entity(int(source_chat_id))
                          else:
                              source_entity = await client.get_entity(int(source_chat_id))
                              
                          target_entity = await client.get_entity(int(chat_id))
                          
                          print(f"✅ تم جلب المصدر والهدف بنجاح")

                          # جلب الرسالة الأصلية من المصدر
                          try:
                              source_messages = await client.get_messages(
                                  source_entity,
                                  ids=source_message_id
                              )
                              
                              if not source_messages:
                                  print(f"❌ لم يتم العثور على الرسالة رقم {source_message_id} في المصدر")
                                  sys.exit(1)
                              
                              source_message = source_messages[0] if isinstance(source_messages, list) else source_messages
                              
                              if source_message is None:
                                  print(f"❌ الرسالة غير موجودة")
                                  sys.exit(1)
                              
                              print(f"✅ تم العثور على الرسالة الأصلية (ID: {source_message.id})")
                              
                              # التحقق من وجود صوت
                              if source_message.voice or source_message.audio:
                                  media_type = "صوتي" if source_message.voice else "ملف صوتي"
                                  file_size = source_message.voice.size if source_message.voice else source_message.audio.size
                                  print(f"🎵 تم العثور على {media_type}، حجمه: {file_size} بايت")
                                  
                                  # تجهيز النص المرفق
                                  caption = source_message.text or ""
                                  if caption:
                                      print(f"📝 النص المرفق: {caption[:100]}...")
                                  
                                  # إرسال الملف
                                  try:
                                      # محاولة إرسال الملف
                                      sent_message = await client.send_file(
                                          target_entity,
                                          file=source_message.media,
                                          caption=caption,
                                          reply_to=message_id if message_id else None
                                      )
                                      print(f"✅ تم إرسال الملف بنجاح (Message ID: {sent_message.id})")
                                      
                                  except FloodWaitError as e:
                                      print(f"⏳ تم حظر الطلب، انتظر {e.seconds} ثانية")
                                      time.sleep(e.seconds)
                                      # محاولة مرة أخرى
                                      sent_message = await client.send_file(
                                          target_entity,
                                          file=source_message.media,
                                          caption=caption,
                                          reply_to=message_id if message_id else None
                                      )
                                      print(f"✅ تم إرسال الملف بنجاح بعد الانتظار (Message ID: {sent_message.id})")
                                      
                              else:
                                  print("❌ الرسالة لا تحتوي على ملف صوتي (voice/audio)")
                                  print(f"نوع المحتوى: {type(source_message.media) if source_message.media else 'بدون ميديا'}")
                                  sys.exit(1)
                                  
                          except ValueError as e:
                              print(f"❌ خطأ في معرف المحادثة: {e}")
                              print("تأكد من أن المعرفات صحيحة (أرقام سالبة للقنوات والمجموعات)")
                              sys.exit(1)
                          except Exception as e:
                              print(f"❌ خطأ أثناء جلب الرسالة: {e}")
                              import traceback
                              traceback.print_exc()
                              sys.exit(1)

                      except ValueError as e:
                          print(f"❌ خطأ في تحويل المعرف: {e}")
                          print("تأكد من أن CHAT_ID و SOURCE_CHAT_ID أرقام صحيحة")
                          sys.exit(1)
                      except Exception as e:
                          print(f"❌ خطأ أثناء جلب الكيانات: {e}")
                          import traceback
                          traceback.print_exc()
                          sys.exit(1)

                  except SessionPasswordNeededError:
                      print("❌ مطلوب كلمة مرور للجلسة - تحقق من TELEGRAM_SESSION")
                      sys.exit(1)
                  except Exception as e:
                      print(f"❌ خطأ في تسجيل الدخول: {e}")
                      import traceback
                      traceback.print_exc()
                      sys.exit(1)
                  finally:
                      await client.disconnect()
                      print("🔌 تم قطع الاتصال")

              except Exception as e:
                  print(f"❌ خطأ غير متوقع: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              try:
                  asyncio.run(main())
              except KeyboardInterrupt:
                  print("🛑 تم إيقاف البرنامج بواسطة المستخدم")
                  sys.exit(0)
              except Exception as e:
                  print(f"❌ خطأ أثناء تشغيل البرنامج: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)
          EOF

      - name: Run Telegram UserBot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.	TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
          SOURCE_CHAT_ID: ${{ github.event.inputs.source_chat_id }}
          SOURCE_MESSAGE_ID: ${{ github.event.inputs.source_message_id }}
          SOURCE_USERNAME: ${{ github.event.inputs.source_username }}
        run: python worker.py
